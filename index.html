<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050706">
<meta name="description" content="wtap — software developer, Linux enthusiast and tinkerer.">
<title>wtap@arch — zsh</title>
<style>
:root{
  --bg:#050706;--panel:#080b09;--panel2:#0b100d;--line:#18241d;
  --green:#39ff14;--green2:#16c60c;--blue:#4da6ff;--cyan:#5ffbf1;
  --yellow:#ffd75f;--red:#ff5577;--text:#c9d1c8;--muted:#617067;
  --shadow:0 0 30px rgba(57,255,20,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;background:
  radial-gradient(circle at 80% 15%,rgba(57,255,20,.045),transparent 28%),
  radial-gradient(circle at 15% 70%,rgba(77,166,255,.035),transparent 25%),
  var(--bg);
  color:var(--text);font:14px/1.6 "JetBrains Mono","Cascadia Code","Fira Code","Courier New",monospace;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:20;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.012) 4px);
  mix-blend-mode:screen;
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:19;
  box-shadow:inset 0 0 120px rgba(0,0,0,.72);
}
::selection{background:var(--green);color:#000}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#050706}
::-webkit-scrollbar-thumb{background:#214a29;border-radius:8px}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--green);text-shadow:0 0 10px rgba(57,255,20,.45)}

.top{
  position:fixed;top:0;left:0;right:0;height:48px;z-index:50;
  display:flex;align-items:center;background:rgba(5,7,6,.9);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  box-shadow:0 4px 25px rgba(0,0,0,.35)
}
.dots{height:100%;display:flex;align-items:center;gap:8px;padding:0 18px;border-right:1px solid var(--line)}
.dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px currentColor}.r{background:#ff5570;color:#ff5570}.y{background:#ffd75f;color:#ffd75f}.g{background:#39ff14;color:#39ff14}
.title{flex:1;text-align:center;color:#657067;font-size:12px;letter-spacing:.3px}
.title b{color:var(--green);font-weight:600}.title span{color:#aeb7ae}
nav{display:flex;height:100%}
nav button{
  position:relative;background:transparent;color:#59645d;border:0;border-left:1px solid var(--line);
  padding:0 18px;font:inherit;font-size:12px;cursor:pointer;text-transform:lowercase;transition:.18s
}
nav button:before{content:"./";color:#27372d}
nav button:hover{color:var(--text);background:#0b100d}
nav button.active{color:var(--green);background:rgba(57,255,20,.035);text-shadow:0 0 9px rgba(57,255,20,.5)}
nav button.active:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--green);box-shadow:0 0 10px var(--green)}

.content{width:min(1180px,100%);margin:48px auto 46px;padding:28px 22px 60px}
.hero{
  min-height:calc(100vh - 95px);display:flex;flex-direction:column;justify-content:center;
  position:relative
}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px}
.block{
  position:relative;background:linear-gradient(145deg,rgba(11,16,13,.94),rgba(6,9,7,.96));
  border:1px solid var(--line);border-radius:7px;padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);overflow:hidden
}
.block:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--green),transparent);opacity:.55}
.block:hover{border-color:#243c2c;box-shadow:0 0 32px rgba(57,255,20,.055)}
.prompt{color:#5c6860;margin-bottom:16px;font-size:12px}
.prompt .u{color:var(--green);font-weight:600}.prompt .host{color:var(--blue)}
.prompt .path{color:var(--green2)}.prompt .cmd{color:#e2e8e1}
.prompt .cursor{color:var(--green);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.neofetch{display:grid;grid-template-columns:minmax(350px,1fr) minmax(300px,.9fr);gap:28px;align-items:center}
.logo-wrap{display:flex;align-items:center;justify-content:center;min-height:380px}
pre{
  color:var(--blue);font-size:clamp(8px,1vw,12px);line-height:1.15;white-space:pre;
  margin:0;text-shadow:0 0 8px rgba(77,166,255,.35);overflow:auto
}
.info-head{color:var(--blue);font-weight:700;font-size:16px;text-shadow:0 0 10px rgba(77,166,255,.35);margin-bottom:10px}
.info-head:before{content:"[ ";color:#456154}.info-head:after{content:" ]";color:#456154}
.kv{display:flex;gap:14px;font-size:13px;margin:3px 0}.k{color:#607067;min-width:92px}.green{color:var(--green)}.cyan{color:var(--cyan)}.yellow{color:var(--yellow)}.blue{color:var(--blue)}.red{color:var(--red)}.dim{color:var(--muted)}
.status-live{display:inline-flex;align-items:center;gap:7px;color:var(--green);margin-top:13px;font-size:11px}
.status-live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
.palette{display:flex;margin-top:18px;height:13px}.palette i{flex:1}.p0{background:#303735}.p1{background:#ff5570}.p2{background:#39ff14}.p3{background:#ffd75f}.p4{background:#4da6ff}.p5{background:#bd5cff}.p6{background:#5ffbf1}.p7{background:#dfe7df}
.readme{font-size:15px;line-height:2}.readme .promptline{color:var(--muted);font-size:12px;margin-bottom:10px}
.bigline{font-size:clamp(22px,4vw,42px);color:#eef4ee;line-height:1.15;letter-spacing:-1px}
.bigline .accent{color:var(--green);text-shadow:0 0 16px rgba(57,255,20,.35)}
.subline{color:#718078;max-width:680px;margin-top:12px}
.cmdline{margin-top:20px;color:#6e7a72}.cmdline b{color:var(--green);font-weight:400}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.quick a{border:1px solid var(--line);padding:11px 13px;color:#748178;transition:.18s}
.quick a:hover{border-color:#2b6135;background:rgba(57,255,20,.025);transform:translateY(-2px)}
.quick strong{display:block;color:var(--blue);font-size:12px}.quick span{font-size:11px;color:#4d5a51}

.out{font-size:13px;line-height:1.9}.out p{margin-bottom:5px}
.div{height:1px;background:var(--line);margin:22px 0}
.bar{display:grid;grid-template-columns:165px 1fr 45px;gap:10px;align-items:center;margin:8px 0;font-size:12px}
.filled{color:var(--green);letter-spacing:1px;text-shadow:0 0 7px rgba(57,255,20,.25)}.empty{color:#1b271f;letter-spacing:1px}.pct{color:#58645b;text-align:right}
.barname{color:#a6afa7}
.tags{margin-top:9px}.tag{display:inline-block;font-size:10px;color:#718078;border:1px solid #1d2a22;padding:2px 7px;margin:0 5px 4px 0;background:#080d0a}
.proj{border:1px solid var(--line);border-left:2px solid #286b31;padding:15px 16px;margin:10px 0;transition:.18s}
.proj:hover{border-color:#2b4a32;border-left-color:var(--green);transform:translateX(3px);background:#0a100c}
.proj h3{color:var(--green);font-size:14px}.proj .lang{color:var(--yellow);font-size:11px;margin-left:9px}.proj a{float:right;font-size:11px}.proj p{font-size:12px;line-height:1.75;margin-top:6px;color:#9ba69d}
.gitline{font-size:12px;margin:4px 0}.gitline .hash{color:var(--yellow);margin-right:10px}
.hobby-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hobby{border:1px solid var(--line);padding:18px;min-height:175px}.hobby:hover{border-color:#2b6135}
.hobby .icon{font-size:25px;color:var(--green);margin-bottom:8px}.hobby h3{color:#e0e8e1;font-size:14px;margin-bottom:7px}.hobby p{color:#69766d;font-size:12px}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact-item{padding:18px;border:1px solid var(--line)}.contact-item .label{color:#5e6b62;font-size:11px}.contact-item a,.contact-item .value{display:block;margin-top:4px;color:var(--green);font-size:14px}

.glitch{position:relative;display:inline-block}
.glitch:hover:before,.glitch:hover:after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;pointer-events:none}
.glitch:hover:before{color:var(--cyan);transform:translate(2px,0);clip-path:inset(0 0 52% 0)}
.glitch:hover:after{color:var(--red);transform:translate(-2px,0);clip-path:inset(52% 0 0 0)}
.terminal-badge{display:inline-flex;border:1px solid #28472e;color:#5e8066;padding:3px 8px;font-size:10px;margin-top:14px}
.footer-note{text-align:center;color:#29352e;font-size:10px;margin-top:5px}
.status{
  position:fixed;bottom:0;left:0;right:0;height:30px;z-index:50;background:rgba(5,7,6,.94);
  border-top:1px solid var(--line);display:flex;align-items:center;padding:0 16px;
  font-size:11px;color:#536057;gap:14px;backdrop-filter:blur(10px)
}
.status .led{color:var(--green);text-shadow:0 0 8px var(--green)}
.status .right{margin-left:auto}
.matrix{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.035;background-image:linear-gradient(rgba(57,255,20,.18) 1px,transparent 1px);background-size:100% 6px}

@media(max-width:900px){
  .title{display:none}.hero-grid,.neofetch{grid-template-columns:1fr}.logo-wrap{min-height:auto}
  .quick,.hobby-grid{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr}
}
@media(max-width:620px){
  nav button{padding:0 8px;font-size:10px}nav button:before{display:none}
  .dots{padding:0 11px}.content{padding:16px 10px 50px}.block{padding:15px 12px}
  .neofetch{gap:10px}.logo-wrap{justify-content:flex-start;overflow-x:auto}
  pre{font-size:7px}.kv{font-size:11px}.bar{grid-template-columns:125px 1fr 38px;font-size:10px}
  .status{font-size:9px;padding:0 9px}.status .right{display:none}
}
</style>
</head>
<body>
<div class="matrix"></div>
<header class="top">
  <div class="dots"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></div>
  <div class="title"><b>wtap</b><span>@arch</span> — zsh <span>•</span> pts/0</div>
  <nav id="nav"></nav>
</header>

<main class="content" id="app"></main>

<footer class="status">
  <span class="led">●</span><span id="statusPage">home</span><span>|</span>
  <span>wtap@arch</span><span>|</span><span id="clock"></span>
  <span class="right">SECURE SHELL // SESSION ACTIVE</span>
</footer>

<script>
const logo=`                  ▄
                 ▄█▄
                ▄███▄
               ▄█████▄
              ▄███████▄
             ▄ ▀▀██████▄
            ▄██▄▄ ▀█████▄
           ▄█████████████▄
          ▄███████████████▄
         ▄█████████████████▄
        ▄███████████████████▄
       ▄█████████▀▀▀▀████████▄
      ▄████████▀      ▀███████▄
     ▄█████████        ████▀▀██▄
    ▄██████████        █████▄▄▄
   ▄██████████▀        ▀█████████▄
  ▄██████▀▀▀              ▀▀██████▄
 ▄███▀▀                       ▀▀███▄
▄▀▀                               ▀▀▄`;

function prompt(cmd,path="~"){
  return `<div class="prompt"><span class="u">wtap</span><span>@</span><span class="host">arch</span><span>:</span><span class="path">${path}</span><span> % </span><span class="cmd">${cmd}</span><span class="cursor">_</span></div>`;
}
function block(cmd,body,path){
  return `<section class="block">${prompt(cmd,path)}${body}</section>`;
}
function kv(k,v,c=""){return `<div class="kv"><span class="k">${k}</span><span class="${c}">${v}</span></div>`}

function home(){
  const info =
    `<div class="info-head">wtap@arch</div>
     ${kv("OS","Arch Linux x86_64","cyan")}
     ${kv("Host","arch","cyan")}
     ${kv("Kernel","Linux x86_64")}
     ${kv("Shell","zsh 5.9")}
     ${kv("Editor","neovim")}
     ${kv("WM","dwm")}
     ${kv("Terminal","alacritty")}
     ${kv("Role","software developer","yellow")}
     ${kv("GitHub","github.com/borismas","blue")}
     <div class="status-live"><i></i> ONLINE / BUILDING THINGS</div>
     <div class="palette"><i class="p0"></i><i class="p1"></i><i class="p2"></i><i class="p3"></i><i class="p4"></i><i class="p5"></i><i class="p6"></i><i class="p7"></i></div>`;
  return `<div class="hero">
    ${block("neofetch",`<div class="neofetch"><div class="logo-wrap"><pre>${logo}</pre></div><div>${info}</div></div>`)}
    ${block("cat README.md",`<div class="readme">
      <div class="promptline"># /home/wtap/README.md</div>
      <div class="bigline">i'm <span class="accent glitch" data-text="wtap">wtap</span>.</div>
      <div class="subline">software developer · linux enthusiast · tinkerer<br>i build tools, break things, learn how they work, then build them better.</div>
      <div class="cmdline"><b>➜</b> use the tabs above to explore <span class="green">_</span></div>
      <div class="quick">
        <a href="#projects"><strong>./projects</strong><span>things i've built</span></a>
        <a href="#about"><strong>./about</strong><span>whoami + skills</span></a>
        <a href="#contact"><strong>./contact</strong><span>open a channel</span></a>
      </div>
    </div>`)}
  </div>`;
}

function about(){
  const bars=[["bash / shell",88],["python",85],["javascript / ts",80],["linux / sysadmin",82],["git",90],["rust",60],["networking / ctf",72],["reading docs first",14]];
  return block("cat whoami.txt",
    kv("name","wtap","green")+kv("role","software developer")+kv("os","arch linux (btw)","cyan")+kv("github","github.com/borismas","blue")+kv("discord","wtap.com"))+
    block("cat bio.txt",`<div class="out"><p>software developer. i build tools that solve problems i have, and occasionally ones other people have too.</p><p>i spend most of my time in the terminal, learning things the hard way, and writing code that works well enough. i run arch, use neovim, and have opinions about both.</p><span class="terminal-badge">[ NO TRACKERS ] [ NO BS ] [ JUST CODE ]</span></div>`)+
    block("cat skills.txt",bars.map(([n,p])=>`<div class="bar"><span class="barname">${n}</span><span><span class="filled">${"█".repeat(Math.round(p/5))}</span><span class="empty">${"░".repeat(20-Math.round(p/5))}</span></span><span class="pct">${p}%</span></div>`).join(""));
}

function hobbies(){
  const data=[
    ["01","coding","building personal tools and scripts","open source contributions","exploring new languages — currently rust","automating anything that feels repetitive"],
    ["02","hacking / ctf","ctf competitions and wargames","penetration testing mindset","reverse engineering binaries","recon and enumeration tooling"],
    ["03","tinkering","home lab setup and maintenance","self-hosting services","messing with hardware","building things that break, fixing them"]
  ];
  return block("ls -la",`<div class="out"><span class="cyan">drwxr-xr-x</span> coding&nbsp;&nbsp;&nbsp; <span class="cyan">drwxr-xr-x</span> hacking&nbsp;&nbsp;&nbsp; <span class="cyan">drwxr-xr-x</span> tinkering</div>`) +
  block("cat hobbies.txt",`<div class="hobby-grid">${data.map(([n,title,...items])=>`<article class="hobby"><div class="icon">${n}</div><h3>${title}</h3><p>${items.join("<br>› ")}</p></article>`).join("")}</div>`);
}

function projects(){
  const ps=[
    ["shadow-map","python","lightweight network recon tool for ctf environments and home lab use. fast host discovery, service fingerprinting, clean markdown output.",["recon","networking","ctf","python"]],
    ["exploit-kit","bash / python","personal ctf toolkit — exploit templates, payload generators, metadata scraper. zero to attacking on a fresh arch install in under 2 minutes.",["ctf","exploit-dev","bash","python"]],
    ["loot-tracker","rust","cli tool for tracking tasks and notes with a dead-simple interface. started as a rust learning project, ended up being something i actually use every day.",["cli","rust","productivity"]]
  ];
  const logs=[["a3f91bc","fix: shadow-map ipv6 without crashing"],["77d002e","feat: exploit-kit payload fuzzer v2"],["9c1aab7","chore: remove line that printed creds to stdout"],["441ffb3","feat: loot-tracker persistent storage"],["0000001","initial commit — works on my machine"]];
  return block("ls -t",`<div class="out"><span class="cyan">shadow-map</span>&nbsp;&nbsp; <span class="cyan">exploit-kit</span>&nbsp;&nbsp; <span class="cyan">loot-tracker</span></div>`) +
    block("cat README.md",ps.map(p=>`<article class="proj"><h3>${p[0]}</h3><span class="lang">${p[1]}</span><a href="https://github.com/borismas" target="_blank" rel="noreferrer">↗ github</a><p>${p[2]}</p><div class="tags">${p[3].map(t=>`<span class="tag">${t}</span>`).join("")}</div></article>`).join(""))+
    block("git log --oneline -5",logs.map(x=>`<div class="gitline"><span class="hash">${x[0]}</span>${x[1]}</div>`).join(""));
}

function contact(){
  return block("cat contact.cfg",`<div class="contact-grid">
    <div class="contact-item"><span class="label">EMAIL</span><a href="mailto:contact.wtap@gmail.com">contact.wtap@gmail.com</a></div>
    <div class="contact-item"><span class="label">GITHUB</span><a href="https://github.com/borismas" target="_blank" rel="noreferrer">github.com/borismas</a></div>
    <div class="contact-item"><span class="label">DISCORD</span><span class="value">wtap.com</span></div>
    <div class="contact-item"><span class="label">STATUS</span><span class="value">open to interesting projects</span></div>
  </div>`) +
  block("cat notes.txt",`<div class="out"><p><span class="cyan">›</span> discord is fastest</p><p><span class="cyan">›</span> open to collabs, ctf teams, interesting projects</p><p class="dim">› not interested in crypto pitches or java jobs</p></div>`);
}

const pages={home:["home",home],about:["about",about],hobbies:["hobbies",hobbies],projects:["projects",projects],contact:["contact",contact]};
const nav=document.getElementById("nav");
nav.innerHTML=Object.keys(pages).map(p=>`<button data-p="${p}">${p}</button>`).join("");

function render(p){
  if(!pages[p]) p="home";
  document.getElementById("app").innerHTML=pages[p][1]();
  document.getElementById("statusPage").textContent=p;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));
  document.title=`wtap@arch — ${p}`;
  history.replaceState(null,"","#"+p);
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.p)));
window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"home"));

function tick(){
  const now=new Date();
  document.getElementById("clock").textContent=now.toLocaleTimeString([],{
    hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"
  });
}
tick();setInterval(tick,1000);
render(location.hash.slice(1)||"home");
</script>
</body>
</html>
